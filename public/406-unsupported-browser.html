<!doctype html>
<html lang="en">

<head>
  <title>Browser not supported · Pragmatic</title>
  <meta charset="utf-8">
  <meta name="viewport" content="initial-scale=1, width=device-width">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/icon.png" type="image/png">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">

  <style>
    /* Self-contained on purpose: error pages must render even when the asset pipeline
         is unavailable, and 406 is shown to browsers that don't support modern CSS.
         Colors mirror the daisyUI default light/dark themes. */
    :root {
      --base-100: #ffffff;
      --base-200: #f8f8f8;
      --base-300: #eeeeee;
      --base-content: #18181b;
      --muted: #71717a;
      --primary: #422ad5;
      --primary-content: #e0e7ff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --base-100: #1d232a;
        --base-200: #191e24;
        --base-300: #15191e;
        --base-content: #ecf9ff;
        --muted: #9ca3af;
        --primary: #605dff;
        --primary-content: #edf1fe;
      }
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--base-200);
      color: var(--base-content);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    header {
      padding: 1rem 1.5rem;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      color: inherit;
      font-size: 1.125rem;
      font-weight: 600;
      text-decoration: none;
    }

    .brand-mark {
      display: inline-block;
      width: 2rem;
      height: 2rem;
      margin-right: 0.5rem;
      border-radius: 0.25rem;
      background: var(--primary);
      color: var(--primary-content);
      line-height: 2rem;
      text-align: center;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1rem;
    }

    .content {
      max-width: 28rem;
      text-align: center;
    }

    .code {
      margin: 0;
      color: var(--primary);
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: 0.08em;
    }

    h1 {
      margin: 0.5rem 0 0;
      font-size: 2.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    p.message {
      margin: 1rem 0 0;
      color: var(--muted);
      font-size: 1.0625rem;
    }

    .button {
      display: inline-block;
      margin-top: 2rem;
      padding: 0.625rem 1.25rem;
      border-radius: 0.25rem;
      background: var(--primary);
      color: #ffffff;
      font-size: 0.875rem;
      font-weight: 600;
      text-decoration: none;
    }

    .button:hover {
      opacity: 0.9;
    }

    footer {
      padding: 1.5rem 1rem;
      color: var(--muted);
      font-size: 0.875rem;
      text-align: center;
    }
  </style>
</head>

<body>
  <header>
    <a href="/" class="brand"><span class="brand-mark">F</span>Pragmatic</a>
  </header>

  <main>
    <div class="content">
      <p class="code">ERROR 406</p>
      <h1>Browser not supported</h1>
      <p class="message">Pragmatic needs a modern browser. Please update to the latest version of Chrome, Firefox,
        Safari or Edge.</p>
    </div>
  </main>

  <footer>&copy; 2026 Pragmatic</footer>
</body>

</html>
