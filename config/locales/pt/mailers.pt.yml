pt:
  guest:
    passwords_mailer:
      reset:
        subject: "Redefinição de senha"
        heading: "Redefina sua senha"
        greeting: "Olá, %{name},"
        explanation: "Recebemos um pedido para redefinir a senha da sua conta no Pragmatic. Use o link abaixo para escolher uma nova."
        action: "Redefinir senha"
        expiration: "O link expira em 15 minutos. Se não foi você quem pediu, pode ignorar este e-mail."
        fallback: "Se o botão não funcionar, copie e cole este link no navegador:"
  mailers:
    layout:
      disclaimer: "Você está recebendo este e-mail por causa de uma atividade na sua conta do Pragmatic."
      copyright: "© %{year} Pragmatic"
  account_mailer:
    deleted:
      subject: "Sua conta no Pragmatic foi excluída"
      heading: "Sua conta foi excluída"
      greeting: "Olá, %{name},"
      explanation: "Sua conta no Pragmatic e todos os seus dados foram removidos definitivamente. Se você não esperava por isso, responda a este e-mail que nós vamos verificar."
